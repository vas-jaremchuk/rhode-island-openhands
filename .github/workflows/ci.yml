name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright (once browser tests exist)
        run: if [ -f playwright.config.js ]; then npx playwright install --with-deps chromium; fi
      - run: npm run setup
      - run: npm run ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
